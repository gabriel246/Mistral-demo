<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>01 · Raymarching-Shader</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;}
  canvas{display:block;width:100vw;height:100vh;}
  a{position:fixed;top:12px;left:14px;color:#ff7a18;text-decoration:none;font:12px ui-monospace,monospace;opacity:.85;z-index:2;}
  #hud{position:fixed;left:14px;bottom:12px;color:#8f9bb8;font:12px ui-monospace,monospace;opacity:.85;user-select:none;pointer-events:none;z-index:2;}
</style>
</head>
<body>
<a href="index.html">← Übersicht</a>
<canvas id="c"></canvas>
<div id="hud">Maus bewegen = Kamera drehen · Szene rotiert automatisch</div>
<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', {antialias:true});
if (!gl) { document.getElementById('hud').textContent = 'WebGL nicht verfügbar'; throw new Error('no webgl'); }

const vsSrc = 'attribute vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }';

const fsSrc = `
precision highp float;
uniform vec2 u_res;
uniform float u_time;
uniform vec2 u_mouse;

mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }

float knot(vec3 p){
  float d = 1e5;
  for (int i = 0; i < 26; i++){
    float t = float(i) / 26.0 * 6.28318;
    float r = 0.85 + 0.40 * cos(3.0 * t);
    vec3 q = vec3(r * cos(2.0 * t), 0.55 * sin(3.0 * t), r * sin(2.0 * t));
    d = min(d, length(p - q) - 0.20);
  }
  return d;
}

vec3 warp(vec3 p){
  p.xz = rot(u_time * 0.12) * p.xz;
  p.yz = rot(u_time * 0.05 + 1.0) * p.yz;
  return p;
}

float map(vec3 p){
  return min(knot(warp(p)), p.y + 1.15);
}

vec3 nrm(vec3 p){
  vec2 e = vec2(0.0012, -0.0012);
  return normalize(e.xyy * map(p + e.xyy) + e.yyx * map(p + e.yyx) + e.yxy * map(p + e.yxy) + e.xxx * map(p + e.xxx));
}

float march(vec3 ro, vec3 rd){
  float t = 0.0;
  for (int i = 0; i < 110; i++){
    float d = map(ro + rd * t);
    if (d < 0.0012 * t + 0.001) return t;
    t += d * 0.85;
    if (t > 25.0) return -1.0;
  }
  return -1.0;
}

vec3 pal(float t){ return 0.5 + 0.5 * cos(6.28318 * (t + vec3(0.0, 0.33, 0.67))); }

void main(){
  vec2 uv = (gl_FragCoord.xy * 2.0 - u_res) / min(u_res.x, u_res.y);
  float az = u_time * 0.15 + u_mouse.x * 6.28318;
  float el = 0.25 + u_mouse.y * 0.9;
  vec3 ro = vec3(cos(az) * 5.2, sin(el) * 2.2 + 0.4, sin(az) * 5.2);
  vec3 fwd = normalize(vec3(0.0, 0.1, 0.0) - ro);
  vec3 right = normalize(cross(fwd, vec3(0.0, 1.0, 0.0)));
  vec3 up = cross(right, fwd);
  vec3 rd = normalize(fwd * 1.6 + uv.x * right + uv.y * up);

  float t = march(ro, rd);
  vec3 fog = vec3(0.015, 0.015, 0.045);
  vec3 col = fog;

  if (t > 0.0){
    vec3 p = ro + rd * t;
    vec3 n = nrm(p);
    vec3 q = warp(p);
    bool isFloor = (p.y + 1.15) < knot(q);
    vec3 L = normalize(vec3(0.6, 0.8, 0.3));
    float dif = max(dot(n, L), 0.0);
    vec3 h = normalize(L - rd);
    float spec = pow(max(dot(n, h), 0.0), 40.0);
    float fres = pow(1.0 - max(dot(n, -rd), 0.0), 3.0);
    if (isFloor){
      vec2 g = abs(fract(p.xz * 0.5) - 0.5);
      float line = smoothstep(0.07, 0.0, min(g.x, g.y));
      col = vec3(0.03, 0.03, 0.06) + line * vec3(0.0, 0.9, 1.0) * 0.8 + dif * vec3(0.05, 0.06, 0.10) + spec * vec3(0.4) * 0.3;
    } else {
      float hue = atan(q.z, q.x) * 0.15 + p.y * 0.3 + u_time * 0.05;
      vec3 base = pal(hue);
      col = base * (0.15 + 0.85 * dif) + spec * vec3(1.0, 0.9, 0.7) * 0.9 + fres * vec3(0.2, 0.4, 1.0) * 0.6;
    }
    float fogF = 1.0 - exp(-t * t * 0.004);
    col = mix(col, fog, fogF);
  }

  col *= 1.0 - 0.4 * dot(uv * 0.6, uv * 0.6);
  col = pow(max(col, vec3(0.0)), vec3(0.4545));
  gl_FragColor = vec4(col, 1.0);
}
`;

function makeShader(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, makeShader(gl.VERTEX_SHADER, vsSrc));
gl.attachShader(prog, makeShader(gl.FRAGMENT_SHADER, fsSrc));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'a');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const uRes = gl.getUniformLocation(prog, 'u_res');
const uTime = gl.getUniformLocation(prog, 'u_time');
const uMouse = gl.getUniformLocation(prog, 'u_mouse');

let mx = 0.5, my = 0.5;
addEventListener('mousemove', e => { mx = e.clientX / innerWidth; my = 1 - e.clientY / innerHeight; });
addEventListener('touchmove', e => { mx = e.touches[0].clientX / innerWidth; my = 1 - e.touches[0].clientY / innerHeight; }, {passive:true});

function resize(){
  const d = Math.min(devicePixelRatio || 1, 1.25);
  canvas.width = Math.floor(innerWidth * d);
  canvas.height = Math.floor(innerHeight * d);
  gl.viewport(0, 0, canvas.width, canvas.height);
}
addEventListener('resize', resize);
resize();

const t0 = performance.now();
function frame(){
  const t = (performance.now() - t0) / 1000;
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform1f(uTime, t);
  gl.uniform2f(uMouse, mx, my);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
