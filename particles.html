<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>02 · Particle Life</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#07070f;}
  canvas{display:block;width:100vw;height:100vh;cursor:crosshair;}
  a{position:fixed;top:12px;left:14px;color:#ff7a18;text-decoration:none;font:12px ui-monospace,monospace;opacity:.85;z-index:2;}
  #hud{position:fixed;left:14px;bottom:12px;color:#8f9bb8;font:12px ui-monospace,monospace;opacity:.9;user-select:none;pointer-events:none;z-index:2;line-height:1.7;}
</style>
</head>
<body>
<a href="index.html">← Übersicht</a>
<canvas id="c"></canvas>
<div id="hud"></div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');

const N = 1400;
const RMIN = 8, RMAX = 70;
const FORCE = 0.35, DAMP = 0.9;

let W, H;
function resize(){ W = canvas.width = innerWidth; H = canvas.height = innerHeight; ctx.fillStyle = '#07070f'; ctx.fillRect(0, 0, W, H); }
addEventListener('resize', resize);
resize();

const x = new Float32Array(N), y = new Float32Array(N);
const vx = new Float32Array(N), vy = new Float32Array(N);
const sp = new Uint8Array(N);

let K = 5;
let M = [];
let colors = [];

function randMatrix(){
  M = [];
  for (let i = 0; i < K; i++){
    const row = [];
    for (let j = 0; j < K; j++) row.push(Math.random() * 2 - 1);
    M.push(row);
  }
}
function setSpecies(k){
  K = Math.max(2, Math.min(8, k));
  colors = [];
  for (let i = 0; i < K; i++) colors.push('hsl(' + Math.round(i / K * 360) + ',95%,62%)');
  for (let i = 0; i < N; i++) sp[i] = (Math.random() * K) | 0;
  randMatrix();
}
function init(){
  for (let i = 0; i < N; i++){
    x[i] = Math.random() * W; y[i] = Math.random() * H;
    vx[i] = 0; vy[i] = 0;
  }
  setSpecies(K);
  ctx.fillStyle = '#07070f'; ctx.fillRect(0, 0, W, H);
}

const mouse = { x: 0, y: 0, active: false };
addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; });
addEventListener('mouseleave', () => mouse.active = false);
addEventListener('mousedown', e => {
  for (let i = 0; i < N; i++){
    const dx = x[i] - e.clientX, dy = y[i] - e.clientY;
    const d = Math.hypot(dx, dy);
    if (d < 130 && d > 0.5){ const f = (1 - d / 130) * 9; vx[i] += dx / d * f; vy[i] += dy / d * f; }
  }
});

let paused = false;
addEventListener('keydown', e => {
  if (e.key === ' ') { paused = !paused; e.preventDefault(); }
  else if (e.key === 'r' || e.key === 'R') randMatrix();
  else if (e.key === '+' || e.key === '=') setSpecies(K + 1);
  else if (e.key === '-') setSpecies(K - 1);
  else if (e.key === 'c' || e.key === 'C') { ctx.fillStyle = '#07070f'; ctx.fillRect(0, 0, W, H); }
});

function step(){
  const rmax2 = RMAX * RMAX;
  for (let i = 0; i < N; i++){
    let fx = 0, fy = 0;
    const xi = x[i], yi = y[i], si = sp[i];
    for (let j = 0; j < N; j++){
      if (j === i) continue;
      const dx = x[j] - xi, dy = y[j] - yi;
      const d2 = dx * dx + dy * dy;
      if (d2 > rmax2 || d2 < 0.01) continue;
      const d = Math.sqrt(d2);
      let f;
      if (d < RMIN) f = d / RMIN - 1;
      else f = M[si][sp[j]] * (1 - Math.abs(2 * d - RMIN - RMAX) / (RMAX - RMIN));
      fx += f * dx / d; fy += f * dy / d;
    }
    if (mouse.active){
      const dx = mouse.x - xi, dy = mouse.y - yi;
      const d = Math.hypot(dx, dy);
      if (d < 220 && d > 1){ const f = (1 - d / 220) * 1.6; fx += f * dx / d; fy += f * dy / d; }
    }
    vx[i] = (vx[i] + fx * FORCE) * DAMP;
    vy[i] = (vy[i] + fy * FORCE) * DAMP;
  }
  for (let i = 0; i < N; i++){
    x[i] += vx[i]; y[i] += vy[i];
    if (x[i] < 2){ x[i] = 2; vx[i] *= -0.5; }
    if (x[i] > W - 2){ x[i] = W - 2; vx[i] *= -0.5; }
    if (y[i] < 2){ y[i] = 2; vy[i] *= -0.5; }
    if (y[i] > H - 2){ y[i] = H - 2; vy[i] *= -0.5; }
  }
}

function draw(){
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(7,7,15,0.28)';
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < N; i++){
    ctx.fillStyle = colors[sp[i]];
    ctx.beginPath();
    ctx.arc(x[i], y[i], 1.8, 0, 6.2832);
    ctx.fill();
  }
}

let frames = 0, lastFpsT = performance.now(), fps = 0;
function loop(){
  if (!paused){ step(); draw(); }
  frames++;
  const now = performance.now();
  if (now - lastFpsT > 500){
    fps = Math.round(frames * 1000 / (now - lastFpsT));
    frames = 0; lastFpsT = now;
    hud.innerHTML = 'Particle Life · ' + N + ' Partikel · ' + K + ' Arten · ' + fps + ' FPS<br>' +
      'Klick = Impuls &nbsp;·&nbsp; Maus = Attraktor &nbsp;·&nbsp; R = neues Regel-Set &nbsp;·&nbsp; +/- = Arten &nbsp;·&nbsp; C = löschen &nbsp;·&nbsp; Leertaste = Pause';
  }
  requestAnimationFrame(loop);
}
init();
loop();
</script>
</body>
</html>
